<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <h2>User Management System</h2>
    <div><a href="/users.html">Dashboard</a><a href="#" id="logoutBtn">Logout</a></div>
</nav>

<div class="container narrow">
    <h1>Add New User</h1>
    <p class="error" id="errorMessage"></p>
    <p class="success" id="successMessage"></p>

    <form id="addUserForm">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter name" minlength="2" maxlength="100" required>
        <p class="error" id="nameError"></p>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter email" required>
        <p class="error" id="emailError"></p>

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" placeholder="Enter phone number" maxlength="10" pattern="[0-9]{10}" required>
        <p class="error" id="phoneError"></p>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required>
        <p class="error" id="passwordError"></p>

        <div class="buttons">
            <button type="submit">Save User</button>
            <a class="btn secondary" href="/users.html">Cancel</a>
        </div>
    </form>
</div>
<script src="/js/app.js"></script>
</body>
</html>
