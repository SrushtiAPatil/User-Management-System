<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - User Management</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <p class="brand-title">User Management System</p>
        <h1>Create Account</h1>
        <p style="text-align:center;">Register to get started</p>

        <p class="error" id="errorMessage"></p>
        <p class="success" id="successMessage"></p>

        <form id="registerForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" minlength="2" maxlength="100" required>
            <p class="error" id="nameError"></p>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <p class="error" id="emailError"></p>

            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="Enter 10-digit phone number" maxlength="10" pattern="[0-9]{10}" required>
            <p class="error" id="phoneError"></p>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required>
            <p class="error" id="passwordError"></p>

            <button type="submit">Create Account</button>
        </form>

        <p class="footer-link">
            Already have an account?
            <a href="/login.html">Login here</a>
        </p>
    </div>
</div>
<script src="/js/app.js"></script>
</body>
</html>
